services:
  - type: web
    name: samanvay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SAMANVAY_SECURE_COOKIE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.4"
